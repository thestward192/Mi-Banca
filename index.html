<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAFAF9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mi Banca" />
    <meta name="description" content="Control de ventas de lotería y banca" />
    <title>Mi Banca</title>
    <script>
      // Aplicar tema y tamano de letra antes de dibujar (sin parpadeo). Ver src/lib/apariencia.ts.
      try {
        var a = JSON.parse(localStorage.getItem('mibanca:apariencia') || '{}')
        var oscuro =
          a.tema === 'oscuro' ||
          (a.tema === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (oscuro) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0C0A09')
        }
        if (a.letra && a.letra !== 'normal') document.documentElement.setAttribute('data-letra', a.letra)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
